name: Long playtest

# 120-day playtests (each persona once; see scripts/playtest.ts) every week, and on demand: too slow for every
# push. The run fails on a crash or a broken rule.
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

jobs:
  playtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 120 days, ten players
        run: npm run playtest:long
